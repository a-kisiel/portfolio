<header id="banner">
    <h2><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h2>
    <nav>
        <ul>
            {{- range where .Site.Menus.main "Params.active" "eq" true -}}
            <li>
                {{ .Pre }}
                <a
                    href="{{ .URL }}"
                    title="{{ .Title }}"
                >{{- .Name -}}</a>{{ .Post }}
            </li>
            {{- end }}
        </ul>
    </nav>
</header>
